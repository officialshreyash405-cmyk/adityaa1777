<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Hand Detection Test</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
    crossorigin="anonymous">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
    crossorigin="anonymous">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
    crossorigin="anonymous">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050008;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transform: scaleX(-1);

      display: none;
    }

    #canvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;
    }

    #status {

      position: fixed;

      top: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      padding: 15px 25px;

      border-radius: 30px;

      background: rgba(0,0,0,.7);

      color: white;

      font-size: 16px;

      text-align: center;

      box-shadow:
        0 0 25px rgba(255,80,220,.5);
    }

  </style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<canvas id="canvas"></canvas>

<div id="status">
  Starting camera...
</div>


<script>

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");


/* =====================================================
   RESIZE
===================================================== */

function resize() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;
}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   MEDIAPIPE HANDS
===================================================== */

const hands =
  new Hands({

    locateFile: function(file) {

      return (
        "https://cdn.jsdelivr.net/npm/" +
        "@mediapipe/hands/" +
        file
      );

    }

  });


hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 1,

  minDetectionConfidence: 0.5,

  minTrackingConfidence: 0.5

});


/* =====================================================
   RESULTS
===================================================== */

hands.onResults(function(results) {

  /*
    Camera frame
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Mirror camera.
  */

  ctx.save();

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    results.image,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  /*
    Dark overlay
  */

  ctx.fillStyle =
    "rgba(5,0,12,.35)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    NO HAND
  */

  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {

    status.innerHTML =
      "🔍 No hand detected";

    status.style.color =
      "#ff9de7";

    return;
  }


  /*
    HAND FOUND
  */

  const count =
    results.multiHandLandmarks.length;


  status.innerHTML =
    "✨ HAND DETECTED — " +
    count +
    " hand" +
    (count > 1 ? "s" : "");


  status.style.color =
    "#9affd7";


  /*
    Draw every detected hand.
  */

  for (
    let i = 0;
    i <
    results.multiHandLandmarks.length;
    i++
  ) {

    const landmarks =
      results.multiHandLandmarks[i];


    /*
      Draw connections.
    */

    ctx.save();

    /*
      Mirror coordinates so they
      match the camera.
    */

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(
      -1,
      1
    );


    drawConnectors(
      ctx,
      landmarks,
      HAND_CONNECTIONS,
      {
        color: "#ff65dc",
        lineWidth: 4
      }
    );


    drawLandmarks(
      ctx,
      landmarks,
      {
        color: "#ffffff",
        lineWidth: 2,
        radius: 5
      }
    );


    ctx.restore();


    /*
      Index fingertip = landmark 8
    */

    const tip =
      landmarks[8];


    const x =
      (1 - tip.x) *
      canvas.width;


    const y =
      tip.y *
      canvas.height;


    /*
      Big fingertip indicator.
    */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      18,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "#ff4fd8";

    ctx.shadowBlur =
      35;

    ctx.shadowColor =
      "#ff4fd8";

    ctx.fill();

    ctx.restore();


    /*
      Handedness.
    */

    if (
      results.multiHandedness &&
      results.multiHandedness[i]
    ) {

      const classification =
        results
          .multiHandedness[i]
          .classification[0];


      console.log(
        "Hand:",
        classification.label,
        "confidence:",
        classification.score
      );


      ctx.save();


      ctx.font =
        "bold 18px Arial";


      ctx.fillStyle =
        "#ffffff";


      ctx.shadowBlur =
        10;

      ctx.shadowColor =
        "#ff4fd8";


      ctx.fillText(

        classification.label,

        x + 25,

        y - 25

      );


      ctx.restore();
    }
  }

});


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

  try {

    status.innerHTML =
      "📷 Requesting camera...";


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: "user",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    status.innerHTML =
      "🧠 Starting hand tracking...";


    /*
      MediaPipe's recommended Camera
      utility continuously sends frames.
    */

    const camera =
      new Camera(

        video,

        {

          onFrame:
            async function() {

              await hands.send({
                image: video
              });

            },

          width: 1280,

          height: 720

        }

      );


    camera.start();


  }

  catch(error) {

    console.error(error);


    status.innerHTML =
      "❌ Camera error: " +
      error.message;
  }

}


startCamera();

</script>

</body>
</html>
