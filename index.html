<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Birthday — Air Drawing</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05020a;
      font-family: Georgia, "Times New Roman", serif;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, #180b24 0%, #08030e 55%, #020106 100%);
    }

    video {
      display: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #canvas {
      z-index: 1;
    }

    #fxCanvas {
      z-index: 2;
      pointer-events: none;
    }

    #ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      color: white;
    }

    #instruction {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: clamp(17px, 2vw, 26px);
      letter-spacing: 0.16em;
      font-weight: 300;
      color: rgba(255, 231, 250, 0.92);
      text-shadow:
        0 0 8px rgba(255, 102, 220, 0.8),
        0 0 22px rgba(176, 83, 255, 0.55);
      opacity: 0;
      transition: opacity 1.2s ease;
      white-space: nowrap;
    }

    #birthday {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      transition:
        opacity 2.2s ease,
        transform 2.2s cubic-bezier(.2,.8,.2,1);
    }

    #birthday.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #birthday .small {
      display: block;
      margin-bottom: 12px;
      font-family: Arial, sans-serif;
      font-size: clamp(11px, 1.2vw, 15px);
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: rgba(255, 221, 244, 0.8);
    }

    #birthday .main {
      display: block;
      font-size: clamp(48px, 9vw, 130px);
      font-weight: normal;
      font-style: italic;
      letter-spacing: 0.025em;
      color: #fff7fd;
      text-shadow:
        0 0 5px #fff,
        0 0 14px #ff8ce8,
        0 0 30px #cf55ff,
        0 0 60px rgba(255, 74, 212, 0.8),
        0 0 100px rgba(178, 78, 255, 0.5);
    }

    #birthday .underline {
      width: 55%;
      height: 1px;
      margin: 20px auto 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 209, 244, .9),
        transparent
      );
      box-shadow: 0 0 14px #ff8ee9;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      background:
        radial-gradient(circle at center, #170a22, #050109 70%);
      color: rgba(255, 235, 250, .9);
      transition: opacity .9s ease, visibility .9s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(255, 188, 239, .2);
      border-top-color: #ff83dd;
      border-right-color: #b86cff;
      box-shadow:
        0 0 18px rgba(255, 91, 214, .5),
        inset 0 0 18px rgba(171, 91, 255, .2);
      animation: spin 1s linear infinite;
    }

    #loadingText {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: rgba(255, 222, 246, .72);
    }

    #error {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 60;
      width: min(90%, 600px);
      padding: 16px 22px;
      border: 1px solid rgba(255, 120, 210, .25);
      border-radius: 14px;
      background: rgba(18, 4, 24, .8);
      backdrop-filter: blur(15px);
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      color: #ffd8f3;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      #instruction {
        top: 7%;
        letter-spacing: .09em;
      }
    }
  </style>
</head>

<body>
<div id="app">

  <video id="video" autoplay muted playsinline></video>

  <canvas id="canvas"></canvas>
  <canvas id="fxCanvas"></canvas>

  <div id="ui">

    <div id="instruction">
      Raise your right hand to draw.
    </div>

    <div id="birthday">
      <span class="small">A little magic for you</span>
      <span class="main">Happy Birthday</span>
      <div class="underline"></div>
    </div>

  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Awakening the magic...</div>
  </div>

  <div id="error"></div>

</div>

<script>
"use strict";

/* ============================================================
   MAGICAL BIRTHDAY AIR DRAWING
   State machine:
   Loading → Drawing → Bouquet → Disperse → Reveal
   ============================================================ */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const fxCanvas = document.getElementById("fxCanvas");

const ctx = canvas.getContext("2d", { alpha: false });
const fx = fxCanvas.getContext("2d");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const instruction = document.getElementById("instruction");
const birthday = document.getElementById("birthday");
const errorBox = document.getElementById("error");

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
  W = canvas.width = fxCanvas.width = window.innerWidth;
  H = canvas.height = fxCanvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* ============================================================
   STATE MACHINE
   ============================================================ */

const STATES = {
  LOADING: "Loading",
  DRAWING: "Drawing",
  BOUQUET: "Bouquet",
  DISPERSE: "Disperse",
  REVEAL: "Reveal"
};

let state = STATES.LOADING;

function setState(next) {
  if (state === next) return;

  state = next;

  switch (next) {

    case STATES.DRAWING:
      instruction.textContent = "Raise your right hand to draw.";
      instruction.style.opacity = "1";
      break;

    case STATES.BOUQUET:
      instruction.textContent = "Bring your other hand close.";
      instruction.style.opacity = "1";
      break;

    case STATES.DISPERSE:
      instruction.style.opacity = "0";
      break;

    case STATES.REVEAL:
      instruction.style.opacity = "0";
      birthday.classList.add("visible");
      break;
  }
}


/* ============================================================
   MEDIAPIPE
   ============================================================ */

let hands;
let faceMesh;

let handsReady = false;
let faceReady = false;

let latestHands = [];
let latestFace = null;

async function initMediaPipe() {

  loadingText.textContent = "Loading hand tracking...";

  hands = new Hands({
    locateFile: file => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.62,
    minTrackingConfidence: 0.58
  });

  hands.onResults(results => {
    latestHands = results.multiHandLandmarks || [];
    processHands();
  });

  loadingText.textContent = "Loading face tracking...";

  faceMesh = new FaceMesh({
    locateFile: file => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.55,
    minTrackingConfidence: 0.55
  });

  faceMesh.onResults(results => {
    latestFace =
      results.multiFaceLandmarks &&
      results.multiFaceLandmarks.length
        ? results.multiFaceLandmarks[0]
        : null;
  });

  /*
    Warm the models up using the webcam frame.
  */
  try {
    await hands.send({ image: video });
    handsReady = true;

    await faceMesh.send({ image: video });
    faceReady = true;

    loadingText.textContent = "Preparing your little surprise...";

  } catch (err) {
    console.warn("MediaPipe warmup:", err);
  }
}


/* ============================================================
   CAMERA
   ============================================================ */

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    loading.classList.add("hidden");

    setState(STATES.DRAWING);

  } catch (err) {

    console.error(err);

    errorBox.style.display = "block";
    errorBox.innerHTML =
      "Camera access is needed for the magic to work.<br>" +
      "Please allow webcam access and reload the page.";

    loadingText.textContent = "Camera permission required.";
  }
}


/* ============================================================
   COORDINATE HELPERS
   ============================================================ */

function mirroredX(x) {
  return (1 - x) * W;
}

function screenPoint(lm) {
  return {
    x: mirroredX(lm.x),
    y: lm.y * H
  };
}

function distance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}


/* ============================================================
   HAND PROCESSING
   ============================================================ */

let rightHand = null;
let leftHand = null;

let previousRightTip = null;
let smoothRightTip = null;

let drawingStartedAt = 0;

let handsTogether = false;
let previousHandDistance = null;
let lastBurstTime = 0;

function identifyHands() {

  rightHand = null;
  leftHand = null;

  if (!latestHands.length) return;

  /*
    Because the webcam is mirrored visually, MediaPipe's
    handedness is still based on the original camera frame.
  */

  for (const hand of latestHands) {

    const wrist = hand[0];

    /*
      MediaPipe provides handedness metadata through results,
      but when processing a generic landmark array we can
      still robustly use wrist / thumb geometry.

      The main drawing experience accepts whichever hand
      MediaPipe identifies as right.
    */
  }
}


/*
  We keep the actual handedness result separately.
*/
let handednessResults = [];

function processHands() {

  if (!latestHands.length) {
    rightHand = null;
    leftHand = null;
    return;
  }

  /*
    We cannot derive handedness from latestHands alone because
    landmark arrays don't contain classification metadata.
    The drawHand() fallback below uses geometric heuristics.
  */

  if (latestHands.length === 1) {

    const hand = latestHands[0];

    /*
      For a single visible hand, determine likely right/left
      using thumb position relative to index finger.
      This works naturally with a mirrored selfie camera.
    */

    const wrist = hand[0];
    const thumb = hand[4];
    const index = hand[8];

    const thumbSide = thumb.x - wrist.x;
    const indexSide = index.x - wrist.x;

    /*
      Right hand tends to place thumb toward camera-frame
      left when palm faces camera.
    */
    const likelyRight =
      thumbSide < indexSide;

    if (likelyRight) {
      rightHand = hand;
      leftHand = null;
    } else {
      leftHand = hand;
      rightHand = null;
    }

  } else {

    const a = latestHands[0];
    const b = latestHands[1];

    const aThumb = a[4].x - a[0].x;
    const aIndex = a[8].x - a[0].x;

    const bThumb = b[4].x - b[0].x;
    const bIndex = b[8].x - b[0].x;

    const aRight = aThumb < aIndex;
    const bRight = bThumb < bIndex;

    if (aRight && !bRight) {
      rightHand = a;
      leftHand = b;
    } else if (bRight && !aRight) {
      rightHand = b;
      leftHand = a;
    } else {
      /*
        Ambiguous case:
        choose based on horizontal wrist position.
      */
      if (a[0].x > b[0].x) {
        rightHand = a;
        leftHand = b;
      } else {
        rightHand = b;
        leftHand = a;
      }
    }
  }
}


/* ============================================================
   FLOWER DRAWING
   ============================================================ */

const trail = [];

const MAX_TRAIL = 520;

function addTrailPoint(point) {

  if (!point) return;

  if (!smoothRightTip) {
    smoothRightTip = {
      x: point.x,
      y: point.y
    };
  }

  /*
    LERP:
    This removes MediaPipe's tiny frame-to-frame jitter.
  */
  smoothRightTip.x +=
    (point.x - smoothRightTip.x) * 0.25;

  smoothRightTip.y +=
    (point.y - smoothRightTip.y) * 0.25;

  const p = {
    x: smoothRightTip.x,
    y: smoothRightTip.y,
    time: performance.now()
  };

  trail.push(p);

  if (trail.length > MAX_TRAIL) {
    trail.shift();
  }
}


function drawTrail(time) {

  if (trail.length < 2) return;

  fx.save();

  fx.lineCap = "round";
  fx.lineJoin = "round";

  /*
    Outer magical glow.
  */
  fx.shadowBlur = 30;
  fx.shadowColor = "rgba(255, 65, 218, .9)";
  fx.strokeStyle = "rgba(255, 96, 225, .25)";
  fx.lineWidth = 13;

  fx.beginPath();

  for (let i = 0; i < trail.length; i++) {

    const p = trail[i];

    if (i === 0) {
      fx.moveTo(p.x, p.y);
    } else {
      fx.lineTo(p.x, p.y);
    }
  }

  fx.stroke();

  /*
    Main luminous stroke.
  */
  fx.shadowBlur = 15;
  fx.shadowColor = "#ff9ae9";
  fx.strokeStyle = "#ffd8f6";
  fx.lineWidth = 2.5;

  fx.beginPath();

  for (let i = 0; i < trail.length; i++) {

    const p = trail[i];

    if (i === 0) {
      fx.moveTo(p.x, p.y);
    } else {
      fx.lineTo(p.x, p.y);
    }
  }

  fx.stroke();

  /*
    Tiny moving spark.
  */
  if (smoothRightTip) {

    fx.beginPath();
    fx.fillStyle = "#ffffff";
    fx.shadowBlur = 25;
    fx.shadowColor = "#ff65d8";
    fx.arc(
      smoothRightTip.x,
      smoothRightTip.y,
      4,
      0,
      Math.PI * 2
    );
    fx.fill();
  }

  fx.restore();
}


/* ============================================================
   FLOWER
   ============================================================ */

let flowerCenter = {
  x: W / 2,
  y: H / 2
};

function calculateFlowerCenter() {

  if (!trail.length) return;

  let sx = 0;
  let sy = 0;

  const start = Math.max(0, trail.length - 180);

  for (let i = start; i < trail.length; i++) {
    sx += trail[i].x;
    sy += trail[i].y;
  }

  const count = trail.length - start;

  flowerCenter.x = sx / count;
  flowerCenter.y = sy / count;
}


function drawFlower(cx, cy, scale = 1, rotation = 0, alpha = 1) {

  fx.save();

  fx.translate(cx, cy);
  fx.rotate(rotation);
  fx.globalAlpha = alpha;

  const petals = 7;

  /*
    Petal glow.
  */
  fx.shadowBlur = 28 * scale;
  fx.shadowColor = "rgba(255, 83, 215, .95)";

  for (let i = 0; i < petals; i++) {

    const angle =
      (Math.PI * 2 * i) / petals;

    fx.save();

    fx.rotate(angle);

    const gradient =
      fx.createRadialGradient(
        0,
        -24 * scale,
        2,
        0,
        -24 * scale,
        38 * scale
      );

    gradient.addColorStop(0, "rgba(255,245,255,.95)");
    gradient.addColorStop(.25, "rgba(255,137,230,.95)");
    gradient.addColorStop(.7, "rgba(173,75,255,.65)");
    gradient.addColorStop(1, "rgba(90,35,170,0)");

    fx.fillStyle = gradient;

    fx.beginPath();

    fx.ellipse(
      0,
      -28 * scale,
      16 * scale,
      37 * scale,
      0,
      0,
      Math.PI * 2
    );

    fx.fill();

    fx.restore();
  }

  /*
    Center.
  */
  fx.shadowBlur = 22 * scale;
  fx.shadowColor = "#ffd36e";

  const centerGradient =
    fx.createRadialGradient(
      0,
      0,
      1,
      0,
      0,
      18 * scale
    );

  centerGradient.addColorStop(0, "#fff9c7");
  centerGradient.addColorStop(.3, "#ffd76d");
  centerGradient.addColorStop(1, "rgba(255,158,53,0)");

  fx.fillStyle = centerGradient;

  fx.beginPath();
  fx.arc(0, 0, 18 * scale, 0, Math.PI * 2);
  fx.fill();

  fx.restore();
}


/* ============================================================
   BOUQUET
   ============================================================ */

let bouquetFlowers = [];
let bouquetCreated = false;

function createBouquet() {

  bouquetFlowers = [];

  const offsets = [
    [-75, 30, .72],
    [-48, -20, .78],
    [0, -48, .95],
    [48, -22, .78],
    [76, 28, .7],
    [-20, 25, .82],
    [25, 28, .82]
  ];

  for (let i = 0; i < offsets.length; i++) {

    bouquetFlowers.push({
      ox: offsets[i][0],
      oy: offsets[i][1],
      scale: offsets[i][2],
      phase: Math.random() * Math.PI * 2,
      rotation: (Math.random() - .5) * .5
    });
  }

  bouquetCreated = true;
}


function getHandCenter(hand) {

  if (!hand) return null;

  let x = 0;
  let y = 0;

  for (const lm of hand) {
    x += mirroredX(lm.x);
    y += lm.y * H;
  }

  return {
    x: x / hand.length,
    y: y / hand.length
  };
}


function getHandDistance() {

  const a = getHandCenter(rightHand);
  const b = getHandCenter(leftHand);

  if (!a || !b) return null;

  return {
    distance: distance(a, b),
    a,
    b,
    center: {
      x: (a.x + b.x) / 2,
      y: (a.y + b.y) / 2
    }
  };
}


function drawBouquet(time) {

  const info = getHandDistance();

  let cx = W / 2;
  let cy = H / 2;

  if (info) {
    cx = info.center.x;
    cy = info.center.y;
  }

  for (const flower of bouquetFlowers) {

    const floatY =
      Math.sin(
        time * .0012 + flower.phase
      ) * 5;

    drawFlower(
      cx + flower.ox,
      cy + flower.oy + floatY,
      flower.scale,
      flower.rotation,
      .96
    );
  }

  /*
    Golden stems.
  */
  fx.save();

  fx.translate(cx, cy);

  fx.shadowBlur = 12;
  fx.shadowColor = "#e9a5ff";
  fx.strokeStyle = "rgba(213,145,255,.55)";
  fx.lineWidth = 2;

  for (const flower of bouquetFlowers) {

    fx.beginPath();
    fx.moveTo(0, 100);
    fx.quadraticCurveTo(
      flower.ox * .4,
      40,
      flower.ox,
      flower.oy + 20
    );
    fx.stroke();
  }

  fx.restore();
}


/* ============================================================
   GATHERING / BURST DETECTION
   ============================================================ */

function checkGathering() {

  const info = getHandDistance();

  if (!info) return false;

  /*
    Scale threshold relative to viewport.
  */
  const threshold =
    Math.min(W, H) * 0.32;

  if (info.distance < threshold) {
    handsTogether = true;
    return true;
  }

  return false;
}


function checkBurst(time) {

  const info = getHandDistance();

  if (!info) {
    previousHandDistance = null;
    return false;
  }

  const d = info.distance;

  if (previousHandDistance === null) {
    previousHandDistance = d;
    return false;
  }

  const velocity =
    d - previousHandDistance;

  previousHandDistance = d;

  /*
    Rapidly increasing distance.
  */
  const burstThreshold =
    Math.min(W, H) * 0.025;

  if (
    handsTogether &&
    velocity > burstThreshold &&
    d > Math.min(W, H) * .36 &&
    time - lastBurstTime > 1200
  ) {
    lastBurstTime = time;
    return true;
  }

  return false;
}


/* ============================================================
   PARTICLES
   ============================================================ */

const particles = [];

function createParticles() {

  particles.length = 0;

  const origin =
    getHandDistance()?.center || flowerCenter;

  const count = Math.min(
    500,
    Math.floor((W * H) / 3000)
  );

  for (let i = 0; i < count; i++) {

    const angle =
      Math.random() * Math.PI * 2;

    const speed =
      1.5 + Math.random() * 9;

    particles.push({
      x: origin.x + (Math.random() - .5) * 100,
      y: origin.y + (Math.random() - .5) * 70,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed - Math.random() * 3,

      size:
        .8 + Math.random() * 4,

      life: 1,

      decay:
        .0025 + Math.random() * .008,

      gravity:
        .025 + Math.random() * .08,

      friction:
        .985 + Math.random() * .012,

      hue:
        Math.random() * 360,

      twinkle:
        Math.random() * Math.PI * 2
    });
  }
}


function updateParticles() {

  let alive = 0;

  for (const p of particles) {

    p.vx *= p.friction;
    p.vy *= p.friction;

    p.vy += p.gravity;

    p.x += p.vx;
    p.y += p.vy;

    p.life -= p.decay;

    if (p.life > 0) {

      alive++;

      const flicker =
        .65 +
        Math.sin(
          performance.now() * .01 +
          p.twinkle
        ) * .35;

      fx.save();

      fx.globalAlpha =
        Math.max(0, p.life) * flicker;

      fx.fillStyle =
        `hsla(${p.hue}, 100%, 75%, 1)`;

      fx.shadowBlur = 15;
      fx.shadowColor =
        `hsla(${p.hue}, 100%, 65%, .9)`;

      fx.beginPath();

      fx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI * 2
      );

      fx.fill();

      fx.restore();
    }
  }

  return alive;
}


/* ============================================================
   FACE CROWN
   ============================================================ */

let crownParticles = [];

for (let i = 0; i < 50; i++) {
  crownParticles.push({
    t: Math.random(),
    phase: Math.random() * Math.PI * 2,
    speed: .4 + Math.random() * .8
  });
}


function facePoint(index) {

  if (!latestFace || !latestFace[index]) {
    return null;
  }

  return {
    x: mirroredX(latestFace[index].x),
    y: latestFace[index].y * H,
    z: latestFace[index].z
  };
}


function drawCrown(time) {

  if (!latestFace) return;

  /*
    MediaPipe Face Mesh landmark references:
      10  = upper forehead / top-center region
      234 = left cheek/side
      454 = right cheek/side

    We use multiple landmarks to estimate:
      center
      width
      tilt
  */

  const top = facePoint(10);
  const left = facePoint(234);
  const right = facePoint(454);

  if (!top || !left || !right) return;

  const centerX =
    (left.x + right.x) / 2;

  /*
    Crown sits slightly above the forehead.
  */
  const centerY =
    top.y - Math.min(W, H) * .06;

  const width =
    Math.max(
      80,
      distance(left, right) * .72
    );

  const angle =
    Math.atan2(
      right.y - left.y,
      right.x - left.x
    );

  drawFlowerCrown(
    centerX,
    centerY,
    width,
    angle,
    time
  );
}


function drawFlowerCrown(
  cx,
  cy,
  width,
  angle,
  time
) {

  fx.save();

  fx.translate(cx, cy);
  fx.rotate(angle);

  const flowerCount = 9;

  /*
    Golden glowing garland arc.
  */
  fx.beginPath();

  fx.moveTo(
    -width * .55,
    8
  );

  fx.quadraticCurveTo(
    0,
    width * .23,
    width * .55,
    8
  );

  fx.strokeStyle =
    "rgba(255,211,113,.85)";

  fx.lineWidth = 2;

  fx.shadowBlur = 15;
  fx.shadowColor = "#ffd36e";

  fx.stroke();

  for (let i = 0; i < flowerCount; i++) {

    const u =
      i / (flowerCount - 1);

    const x =
      (u - .5) * width;

    const y =
      10 +
      Math.sin(u * Math.PI) *
      width * .20;

    const scale =
      .24 +
      Math.sin(u * Math.PI) * .10;

    const bob =
      Math.sin(
        time * .002 +
        i * .8
      ) * 2;

    drawTinyCrownFlower(
      x,
      y + bob,
      scale,
      time * .001 + i
    );
  }

  /*
    Floating crown sparkles.
  */
  for (const p of crownParticles) {

    const x =
      (p.t - .5) * width * 1.3;

    const y =
      4 +
      Math.sin(
        p.t * Math.PI
      ) * width * .2;

    const sparkle =
      .5 +
      .5 *
      Math.sin(
        time * .003 * p.speed +
        p.phase
      );

    fx.globalAlpha = sparkle * .7;

    fx.fillStyle = "#fff4bd";
    fx.shadowBlur = 12;
    fx.shadowColor = "#ffc8ed";

    fx.beginPath();

    fx.arc(
      x,
      y - 10,
      1 + sparkle * 2,
      0,
      Math.PI * 2
    );

    fx.fill();
  }

  fx.restore();
}


function drawTinyCrownFlower(
  x,
  y,
  scale,
  rotation
) {

  fx.save();

  fx.translate(x, y);
  fx.rotate(rotation);

  const colors = [
    "#ff9de6",
    "#d98aff",
    "#ffd88c",
    "#ffb4ee"
  ];

  const color =
    colors[
      Math.floor(
        Math.abs(Math.sin(rotation)) *
        colors.length
      ) % colors.length
    ];

  fx.shadowBlur = 13;
  fx.shadowColor = color;

  for (let i = 0; i < 5; i++) {

    fx.save();

    fx.rotate(
      (Math.PI * 2 * i) / 5
    );

    fx.fillStyle = color;

    fx.beginPath();

    fx.ellipse(
      0,
      -7 * scale,
      4.5 * scale,
      9 * scale,
      0,
      0,
      Math.PI * 2
    );

    fx.fill();

    fx.restore();
  }

  fx.fillStyle = "#ffe7a0";

  fx.beginPath();

  fx.arc(
    0,
    0,
    3 * scale,
    0,
    Math.PI * 2
  );

  fx.fill();

  fx.restore();
}


/* ============================================================
   BACKGROUND / CAMERA RENDER
   ============================================================ */

function drawCameraBackground() {

  if (
    video.readyState <
    HTMLMediaElement.HAVE_CURRENT_DATA
  ) {
    return;
  }

  ctx.save();

  /*
    Mirrored looking-glass camera.
  */
  ctx.translate(W, 0);
  ctx.scale(-1, 1);

  const videoRatio =
    video.videoWidth /
    video.videoHeight;

  const screenRatio =
    W / H;

  let dw;
  let dh;
  let dx;
  let dy;

  /*
    Cover the screen while preserving aspect ratio.
  */
  if (videoRatio > screenRatio) {

    dh = H;
    dw = H * videoRatio;

    dx = (W - dw) / 2;
    dy = 0;

  } else {

    dw = W;
    dh = W / videoRatio;

    dx = 0;
    dy = (H - dh) / 2;
  }

  ctx.drawImage(
    video,
    dx,
    dy,
    dw,
    dh
  );

  ctx.restore();

  /*
    Dark ethereal overlay.
  */
  const overlay =
    ctx.createRadialGradient(
      W / 2,
      H / 2,
      Math.min(W, H) * .12,
      W / 2,
      H / 2,
      Math.max(W, H) * .75
    );

  overlay.addColorStop(
    0,
    "rgba(8, 2, 16, .10)"
  );

  overlay.addColorStop(
    .55,
    "rgba(7, 1, 13, .30)"
  );

  overlay.addColorStop(
    1,
    "rgba(2, 0, 6, .70)"
  );

  ctx.fillStyle = overlay;
  ctx.fillRect(0, 0, W, H);

  /*
    Subtle purple atmosphere.
  */
  const aura =
    ctx.createRadialGradient(
      W * .5,
      H * .55,
      0,
      W * .5,
      H * .55,
      Math.max(W, H) * .55
    );

  aura.addColorStop(
    0,
    "rgba(130, 45, 170, .08)"
  );

  aura.addColorStop(
    1,
    "rgba(0, 0, 0, 0)"
  );

  ctx.fillStyle = aura;
  ctx.fillRect(0, 0, W, H);
}


/* ============================================================
   FX CLEARING
   ============================================================ */

function clearFX() {

  fx.clearRect(
    0,
    0,
    W,
    H
  );
}


/* ============================================================
   MAIN ANIMATION LOOP
   ============================================================ */

let lastFrame = performance.now();
let lastSend = 0;

async function animationLoop(time) {

  drawCameraBackground();
  clearFX();

  /*
    Feed webcam frames to MediaPipe at a controlled rate.
  */
  if (
    video.readyState >=
    HTMLMediaElement.HAVE_CURRENT_DATA
  ) {

    if (time - lastSend > 25) {

      lastSend = time;

      try {
        await hands.send({
          image: video
        });
      } catch (err) {
        console.warn("Hands frame:", err);
      }

      /*
        Face Mesh is only needed for the reveal.
        This keeps the earlier phases lighter.
      */
      if (
        state === STATES.REVEAL &&
        faceReady
      ) {
        try {
          await faceMesh.send({
            image: video
          });
        } catch (err) {
          console.warn("Face frame:", err);
        }
      }
    }
  }


  /* ========================================================
     DRAWING
     ======================================================== */

  if (state === STATES.DRAWING) {

    if (rightHand) {

      const indexTip =
        rightHand[8];

      const point =
        screenPoint(indexTip);

      addTrailPoint(point);

      if (!drawingStartedAt) {
        drawingStartedAt = time;
      }

      /*
        Draw trail continuously.
      */
      drawTrail(time);

      /*
        Once the user has drawn for ~5 seconds,
        turn the accumulated gesture into a flower.
      */
      if (
        time - drawingStartedAt >
        5000 &&
        trail.length > 40
      ) {

        calculateFlowerCenter();

        setState(STATES.BOUQUET);
      }

    } else {

      /*
        Don't immediately reset the drawing timer
        if the hand temporarily leaves frame.
      */
      drawTrail(time);
    }
  }


  /* ========================================================
     BOUQUET
     ======================================================== */

  else if (state === STATES.BOUQUET) {

    drawTrail(time);

    /*
      Slowly transform the original trail
      into a recognizable flower.
    */
    calculateFlowerCenter();

    const flowerProgress =
      Math.min(
        1,
        (time - drawingStartedAt - 5000) /
        1200
      );

    drawFlower(
      flowerCenter.x,
      flowerCenter.y,
      .8 + flowerProgress * .25,
      Math.sin(time * .0005) * .05,
      flowerProgress
    );

    if (checkGathering()) {

      if (!bouquetCreated) {
        createBouquet();
      }

      drawBouquet(time);

      /*
        Once both hands have gathered,
        prepare to detect separation.
      */
      if (checkBurst(time)) {
        setState(STATES.DISPERSE);
        createParticles();
      }
    }
  }


  /* ========================================================
     DISPERSE
     ======================================================== */

  else if (state === STATES.DISPERSE) {

    const alive =
      updateParticles();

    /*
      A soft residual flower glow.
    */
    if (alive > 0) {

      fx.save();

      fx.globalAlpha = .15;
      fx.shadowBlur = 60;
      fx.shadowColor = "#ff65d8";

      fx.fillStyle =
        "rgba(255,110,220,.12)";

      fx.beginPath();

      fx.arc(
        W / 2,
        H / 2,
        Math.min(W, H) * .22,
        0,
        Math.PI * 2
      );

      fx.fill();

      fx.restore();
    }

    /*
      Once most particles have disappeared,
      reveal the birthday message.
    */
    if (
      particles.length &&
      alive === 0
    ) {
      setState(STATES.REVEAL);
    }
  }


  /* ========================================================
     REVEAL
     ======================================================== */

  else if (state === STATES.REVEAL) {

    /*
      Floating ambient particles.
      Keep a few gentle particles around the reveal.
    */
    drawAmbientSparkles(time);

    /*
      Virtual flower crown.
    */
    drawCrown(time);
  }

  requestAnimationFrame(animationLoop);
}


/* ============================================================
   AMBIENT REVEAL SPARKLES
   ============================================================ */

const ambient = [];

for (let i = 0; i < 100; i++) {

  ambient.push({
    x: Math.random(),
    y: Math.random(),
    radius: .5 + Math.random() * 2,
    speed: .1 + Math.random() * .4,
    phase: Math.random() * Math.PI * 2
  });
}


function drawAmbientSparkles(time) {

  fx.save();

  for (const p of ambient) {

    const x =
      p.x * W;

    const y =
      ((p.y * H) -
        time * p.speed * .02) % H;

    const opacity =
      .25 +
      .35 *
      Math.sin(
        time * .001 +
        p.phase
      );

    fx.globalAlpha =
      Math.max(.05, opacity);

    fx.fillStyle = "#ffd7f4";

    fx.shadowBlur = 10;
    fx.shadowColor = "#ff79d9";

    fx.beginPath();

    fx.arc(
      x,
      y < 0 ? y + H : y,
      p.radius,
      0,
      Math.PI * 2
    );

    fx.fill();
  }

  fx.restore();
}


/* ============================================================
   STARTUP
   ============================================================ */

async function boot() {

  try {

    /*
      Initialize MediaPipe asynchronously while
      the loading screen is visible.
    */
    await initMediaPipe();

    /*
      Start webcam.
    */
    await startCamera();

    /*
      Begin rendering.
    */
    requestAnimationFrame(animationLoop);

  } catch (err) {

    console.error("Boot error:", err);

    loadingText.textContent =
      "Something went wrong. Please reload.";
  }
}

boot();

</script>
